name: CAD queue tests (no native SolidWorks)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  queue:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      # Hosted Windows TEMP can use an 8.3 alias. Keep synthetic fixtures on the
      # canonical runner path without weakening the deployment path checks.
      - name: Use canonical temporary paths for tests
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-queue.txt
      - run: python -m pip install -r requirements-queue.txt
      - name: Journal, broker, deployment and native boundary doubles
        run: python -m unittest discover -s tests -p 'test_queue_*.py' -v
      - name: Compile source
        run: python -m compileall -q solidworks_mcp scripts
      - name: Native qualification harness (pure tests only)
        run: python -m unittest discover -s tests -p 'test_native_qualification.py' -v
      - run: git diff --check
